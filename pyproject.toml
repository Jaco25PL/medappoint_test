[project]
name = "medappoint-qa-challenge"
version = "0.1.0"
description = "QA challenge deliverables for MedAppoint: functional testing, SQL, API (Postman) and UI automation (Playwright + pytest)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["e2e/tests"]
pythonpath = ["."]
addopts = [
    "--browser=chromium",
    "--tracing=retain-on-failure",
    "--screenshot=only-on-failure",
    "--output=reports/test-results",
    "--html=reports/report.html",
    "--self-contained-html",
]
markers = [
    "smoke: fast checks that the environment and critical paths are up",
    "reschedule: tests covering the reschedule user story",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
